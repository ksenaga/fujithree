<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- favicon -->
    <link rel="icon" type="image/webp" sizes="425x425" href="./images/FUJI-THREE_logo.webp">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">

    <title>会社概要 | FUJI THREE</title>
</head>
<body>
  <div id="balls" class="about-ball"></div>
  <main class="about" id="mainContent">
    <!-- 見出し -->
    <section class="about-hero">
      <h1>会社概要</h1>
    </section>
    <!-- 会社情報 -->
    <section class="about-company">
      <dl class="company-list">
        <div class="company-item">
          <dt>名称</dt>
          <dd>FUJI THREE株式会社</dd>
        </div>
        <div class="company-item">
          <dt>設立</dt>
          <dd>2017年</dd>
        </div>
        <div class="company-item">
          <dt>所在地</dt>
          <dd>沖縄県那覇市山下町 7-19-305</dd>
        </div>
        <div class="company-item">
          <dt>従業員数</dt>
          <dd>30人</dd>
        </div>
        <div class="company-item">
          <dt>TEL</dt>
          <dd>050-3749-5455</dd>
        </div>
        <div class="company-item">
          <dt>FAX</dt>
          <dd>050-6868-9484</dd>
        </div>
        <div class="company-item">
          <dt>事業概要</dt>
          <dd>デザイン / 福祉</dd>
        </div>
      </dl>
    </section>
    <!-- 事業紹介 -->
    <section class="about-business">
      <div class="business-grid">
          <!-- デザイン事業 -->
          <div class="business-card">
          <h3>デザイン事業</h3>
          <p>
              店舗デザインから、イラスト、ロゴ、インテリアまで<br>
              デザイン周りをトータルでコーディネートします。
          </p>
          <ul>
              <li>店舗デザイン</li>
              <li>ロゴデザイン</li>
              <li>サインデザイン</li>
          </ul>
          </div>
          <!-- 福祉事業 -->
          <div class="business-card">
          <h3>福祉事業</h3>
          <p>
              地域に根ざした福祉サービスを展開しています。
          </p>
          <ul>
              <li>グループホームの運営（2箇所）</li>
              <li>生活支援サービス</li>
              <li>地域交流イベントの企画</li>
          </ul>
          </div>
      </div>
    </section>
  </main>
<script src="./js/main.js"></script>
<script src="./js/ball.js"></script>
